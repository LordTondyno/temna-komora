<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tmavá komora – editor fotek</title>
<meta name="description" content="Prohlížečový editor fotek ve stylu Lightroom: RAW náhledy, TIFF, filmové předvolby, retuš.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#121214;--pan:#1c1c1f;--pan2:#252529;--line:#2b2b30;--ink:#e6e6e9;--mute:#8d8d95;--acc:#5b9cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12.5px/1.4 Inter,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-rows:46px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
header{display:flex;gap:8px;align-items:center;padding:0 14px;background:linear-gradient(#232327,#1c1c1f);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font:600 15px Georgia,"Times New Roman",serif;letter-spacing:.02em;margin-right:16px;white-space:nowrap}
.logo svg{width:21px;height:21px;stroke:var(--acc);fill:none;stroke-width:1.5}
#info{margin-right:auto;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button,select{background:var(--pan2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
button:hover,select:hover{background:#2f2f35;border-color:#3d3d44}
button.on{background:var(--acc);border-color:var(--acc);color:#07111f;font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template-columns:208px 1fr 300px;min-height:0}
aside{background:var(--pan);overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
#L{border-right:1px solid var(--line)}#R{border-left:1px solid var(--line)}
#center{display:grid;grid-template-rows:1fr auto auto;min-width:0;min-height:0}
#stage{display:flex;overflow:hidden;padding:16px;background:radial-gradient(ellipse at 50% 40%,#1b1b1f 0%,#0f0f11 100%);min-height:0}
#view{margin:auto;flex:none;border-radius:2px;touch-action:none;box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}
#cur{position:fixed;pointer-events:none;border:1px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.7);display:none;transform:translate(-50%,-50%);z-index:5}
#bar{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--pan);border-top:1px solid var(--line);overflow:hidden}
#hint{margin-left:auto;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#stars{display:flex;gap:1px;margin-left:10px}
#stars button{padding:1px 5px;background:none;border:0;color:#5d5d66;font-size:16px}
#stars button.on{background:none;color:#f5c542}
#film{display:flex;gap:8px;padding:8px 12px;background:var(--pan);border-top:1px solid var(--line);overflow-x:auto;height:92px;scrollbar-width:thin}
.th{position:relative;border-radius:4px;overflow:hidden;cursor:pointer;flex:none;height:72px;opacity:.65;outline:2px solid transparent;outline-offset:1px;transition:opacity .15s,outline-color .15s}
.th:hover{opacity:1}.th.sel{opacity:1;outline-color:var(--acc)}.th canvas{display:block;height:100%}
.bd{position:absolute;left:4px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;margin:0 3px 0 1px}
details[open]>summary::before{transform:rotate(45deg)}
summary:hover{background:#212125}
.body{padding:4px 14px 12px}
.pr{display:block;width:calc(100% - 12px);margin:0 6px;text-align:left;background:none;border:0;border-radius:5px;padding:5px 10px;color:#c4c4ca}
.pr:hover{background:#2a2a2f;color:var(--ink)}.pr.act{background:rgba(91,156,255,.16);color:#fff}
#presets{padding:4px 0}#presets summary{font-weight:500;color:#b9b9c0;background:#212124}
.sl{margin:7px 0}.sl>div{display:flex;justify-content:space-between;color:#a6a6ae;margin-bottom:1px}
.sl output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:16px;margin:0;-webkit-appearance:none;appearance:none;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#3b3b41 var(--a,0%),var(--acc) var(--a,0%),var(--acc) var(--b,0%),#3b3b41 var(--b,0%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#3b3b41 var(--a,0%),var(--acc) var(--a,0%),var(--acc) var(--b,0%),#3b3b41 var(--b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#f1f1f3;margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.7);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#f1f1f3;box-shadow:0 1px 4px rgba(0,0,0,.7)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
input[data-g=temp]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#3a7bd5,#e8d44d)}
input[data-g=tint]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#4caf50,#c24bb0)}
input[data-g=temp]::-moz-range-track{background:linear-gradient(90deg,#3a7bd5,#e8d44d)}
input[data-g=tint]::-moz-range-track{background:linear-gradient(90deg,#4caf50,#c24bb0)}
#hist{display:block;width:100%;height:92px;background:#141416;border-bottom:1px solid var(--line)}
#tools{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
#tools button{flex:1;height:36px;padding:0;display:grid;place-items:center}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
#drop{display:none;position:fixed;inset:12px;border:2px dashed var(--acc);border-radius:14px;background:rgba(12,12,16,.78);z-index:20;place-items:center;pointer-events:none;font:500 20px Georgia,serif}
.drag #drop{display:grid}
#tabs{display:none}
@media(max-width:900px){
 body{height:100dvh;grid-template-rows:auto minmax(0,1fr)}
 header{flex-wrap:wrap;min-height:46px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px}
 .logo{margin-right:auto}#info{display:none}
 #app{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) auto minmax(0,1fr)}
 #center{order:1}
 #tabs{order:2;display:flex;background:var(--pan);border-top:1px solid var(--line)}
 #tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px 8px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent}
 #tabs button.on{background:none;color:var(--ink);border-bottom-color:var(--acc)}
 #L,#R{order:3;border:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
 body[data-tab=edit] #L,body[data-tab=presets] #R{display:none}
 #stage{padding:8px}
 #bar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding:6px 10px}#bar button{flex:none;white-space:nowrap}#hint{flex:none}
 #film{height:70px;padding:6px 10px}.th{height:56px}
 button,select{min-height:38px}
 summary{padding:13px 14px}.pr{padding:11px 12px}
 input[type=range]{height:30px}
 input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-9px}
 input[type=range]::-moz-range-thumb{width:22px;height:22px}
 #tools button{height:44px}
 #stars button{font-size:20px;padding:0 6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function jpegEnd(u,s){let i=s+2;const n=u.length;
